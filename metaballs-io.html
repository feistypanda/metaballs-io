    <script type>
        
(() => {

// globals

const [WIDTH, HEIGHT] = [600, 600];

let delataTime = 33;
let click = false;
let keys = {};

const copyObj = obj => JSON.parse(JSON.stringify(obj));

const images = (() => {

// bearkirb's Vector lib
const Vector = (() => {
    class Vector {
        constructor(x = 0, y = 0, z = 0) {
            this.x = x;
            this.y = y;
            this.z = z;
        }
        subtract(v) {
            var ve = new Vector(this.x, this.y, this.z);
            ve.x -= v.x;
            ve.y -= v.y;
            ve.z -= v.z;
            return ve;
        }
        add(v) {
            var ve = new Vector(this.x, this.y, this.z);
            ve.x += v.x;
            ve.y += v.y;
            ve.z += v.z;
            return ve;
        }
        divide(n) {
            var ve = new Vector(this.x, this.y, this.z);
            ve.x /= n;
            ve.y /= n;
            ve.z /= n;
            return ve;
        }

        mult(n) {
            var ve = new Vector(this.x, this.y, this.z);
            ve.x *= n;
            ve.y *= n;
            ve.z *= n;
            return ve;
        }

        square (v) {
            var ve = new Vector(this.x, this.y, this.z);
            ve.x *= ve.x;
            ve.y *= ve.y;
            ve.z *= ve.z;
            return ve;
        }

        magnitude() {
            return Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z);
        }
        magSq() {
            return this.x * this.x + this.y * this.y + this.z * this.z;
        }
        dot(v) {
            return this.x * v.x + this.y * v.y + this.z * v.z;
        }
        scale(n) {
            var ve = new Vector(this.x, this.y, this.z);
            ve.x *= n;
            ve.y *= n;
            ve.z *= n;
            return ve;
        }
        normalize() {
            var ve = new Vector(this.x, this.y, this.z);
            if (ve.x === 0 && ve.y === 0 && ve.z === 0) return ve;
            ve = ve.divide(ve.magnitude());
            return ve;
        }
        rotateBy(ang) {
            return new Vector(this.x * Math.cos(ang) - this.y * Math.sin(ang), this.x * Math.sin(ang) + this.y * Math.cos(ang));
        }
        rotateAround(ang, v) {
            var ve = new Vector(this.x, this.y, this.z);
            ve = ve.subtract(v).rotateBy(ang).add(v);
            return ve;
        }
        rotate3d(anglex, angley){
            var ve = new Vector(this.x,this.y,this.z);
            var ro1 = new Vector(this.y,this.z).rotateBy(-anglex);
            var ro2 = new Vector(this.x,ro1.y).rotateBy(-angley);
            ve.y = ro1.x
            ve.z = ro1.y;
                        
            ve.x = ro2.x;
            ve.z = ro2.y;
            return ve;
        }
        reflect(n) {
            var ve = new Vector(this.x, this.y);
            ve = ve.subtract(n.scale(2 * ve.dot(n)))
            return ve;
        }
        abs() {
            var ve = new Vector(this.x, this.y, this.z);
            ve.x = Math.abs(ve.x);
            ve.y = Math.abs(ve.y);
            ve.z = Math.abs(ve.z);
            return ve;
        }
        max(n) {
            var ve = new Vector(this.x, this.y, this.z);
            ve.x = Math.max(ve.x, n);
            ve.y = Math.max(ve.y, n);
            ve.z = Math.max(ve.z, n);
            return ve;
        }
        copy(v) {
            return new Vector(this.x, this.y, this.z);
        }
    } 
    return Vector;
})();

const renderMetaBalls = (() => {

    const tileSize = 10;
    const isovalue = 1;

    function getValueAtPoint (metaballs, point) {
        let value = 0;

        for (const i of metaballs) {
            value += i.radius / Math.hypot(i.x - point.x, i.y - point.y);
        }

        return value;
    }

    const getShapeMesh = (() => {

        const sidesKey = [
            [0, -1],
            [1, 0],
            [0, 1],
            [-1, 0],
        ];

        let lastCoordsPushed = false;

        // figure out which side the line in the current cell is leading into
        const getNext = (linkedSides, prev) => {

            let next = linkedSides[0][0];

            if (prev !== null) {
                for (const i of linkedSides) {

                    let ind = i.indexOf(prev);
                    if (ind >= 0) {
                        next = i[(ind + 1) % i.length];
                        break;
                    }
                }
            }

            return next;
        }

        function pushLine (res, next) {
            if (!res.dat) return;

            if (res.dat.length === 1) {
                shapes[shapes.length - 1].push(res.dat[0].slice(0, 2));
                return;
            }

            // If there are multiple possible lines to push, find which one connects to the current shape
            for (const i of res.dat) {
                if (i[2].includes(next)) shapes[shapes.length - 1].push(i.slice(0, 2));
            }
        }

        return function (metaballs, x, y, prev = null, itter = 0) {

            let res = marchingSquaresCell(metaballs, x, y);
            if (!res) return;
            if (prev === null) shapes.push([]); // starting a new shape

            let next = getNext(res.connections, prev);

            let newPrev = (next + 2) % 4; // figure out what the previos tile is going to be for the next tile

            let nextX = x + sidesKey[next][0] * tileSize;
            let nextY = y + sidesKey[next][1] * tileSize;

            pushLine(res, next); 

            if (next !== false && itter < 500) getShapeMesh(metaballs, nextX, nextY, newPrev, itter + 1);
        }
    })();

    // A function that draws a cell and then returns the coordinates of the cells that the lines lead into
    const marchingSquaresCell = (() => {

        // An array that determines what lines to draw for a given combination of corners being above the isovalue
        // The first two values are the corners to be interpolated between for the first endpoint of the line, and the second two are for the second endpoint of the line
        const linesKey = [
            [            ], // 0
            [[2, 3, 0, 3]], // 1
            [[1, 2, 2, 3]], // 2
            [[1, 2, 3, 0]], // 3
            [[0, 1, 1, 2]], // 4
            [[1, 2, 2, 3],
             [0, 1, 3, 0]], // 5
            [[0, 1, 2, 3]], // 6
            [[0, 1, 3, 0]], // 7
            [[0, 1, 3, 0]], // 8
            [[0, 1, 2, 3]], // 9
            [[0, 1, 1, 2],
             [2, 3, 0, 3]], // 10
            [[0, 1, 1, 2]], // 11
            [[1, 2, 3, 0]], // 12
            [[1, 2, 2, 3]], // 13
            [[2, 3, 0, 3]], // 14
            [            ], // 15
        ];

        const sidesKey = (() => {
            const sidesKey = {
                "01": 0,
                "12": 1,
                "23": 2,
                "30": 3,
            };

            for (const key in sidesKey) {
                sidesKey[key[1] + key[0]] = sidesKey[key];
            }

            return sidesKey;
        })();

        // Generate a key that linkes sides together based on how the lines are drawn
        const connectionsKey = (() => {

            let key = [];

            key = linesKey.map(a => {
                if (a.length < 1) return [];

                let res = a.map(b => {
                    return [
                        sidesKey[`${b[0]}${b[1]}`],
                        sidesKey[`${b[2]}${b[3]}`],
                    ]
                });

                return res;
            });

            return key;
        })();

        const cornerKey = [[0, 0], [1, 0], [1, 1], [0, 1]];

        function generateCode (cornerValues) {
            let code = 0;

            for (let i = 0; i < cornerValues.length; i ++) {
                if (cornerValues[i] > isovalue) code = code | (1 << (3 - i));
            }

            return code;
        }

        const getLine = (() => {

            function lerpCorners (a, b) {

                let smaller = a.value < b.value ? a : b;
                let larger  = a.value < b.value ? b : a;

                if (smaller.value > isovalue || larger.value < isovalue) throw(new ReferenceError("corners for generating lines are not correct"));

                let diff = larger.value - smaller.value;
                let toIso = isovalue - smaller.value;
                let amt = toIso/diff;

                return [lerp(smaller.x, larger.x, amt), lerp(smaller.y, larger.y, amt)];
            }

            return function (x, y, lineCorners, cornerValues) {
                let cornerCoords = lineCorners.map(a => {
                    return {
                        x: x + cornerKey[a][0] * tileSize,
                        y: y + cornerKey[a][1] * tileSize,
                        value: cornerValues[a],
                    };
                });

                return lerpCorners(cornerCoords[0], cornerCoords[1]).concat(lerpCorners(cornerCoords[2], cornerCoords[3]));
            }
        })();

        function getLineCoords (x, y, lines, cornerValues, code) {

            let res = [];

            for (const i of lines) {
                let coords = getLine(x, y, i, cornerValues);

                const connections = [
                    sidesKey[`${i[0]}${i[1]}`], 
                    sidesKey[`${i[2]}${i[3]}`]
                ];

                res.push([{x: coords[0], y: coords[1]}, {x: coords[2], y: coords[3]}, connections]);
            }

            return res;
        }

        return function (metaballs, x, y) {

            // Make sure that we havent already drawn this cell this frame
            const key = `${x},${y}`;
            
            if (tilesProcessed.has(key)) return false;

            // Get the values at the corners of the cell
            let cornerValues = cornerKey.map(a => getValueAtPoint(metaballs, {x: x + a[0] * tileSize, y: y + a[1] * tileSize}));

            let code = generateCode(cornerValues);

            // We dont want to prevent cells of type 5 and 10 from being drawn twice because those cells are parts of two different shapes
            if (code !== 5 && code !== 10) tilesProcessed.add(key);

            // Quit early if there are no lines to draw
            if (code === 0 || code === 15) return false;

            let lines = linesKey[code];

            let linesDat = getLineCoords(x, y, lines, cornerValues, code);

            return {connections: connectionsKey[code], dat: linesDat};
        }
    })();

    const tilesProcessed = new Set();
    let shapes = [[]];

    const assembleShape = (() => {

        const same = (a, b) => a.x === b.x && a.y === b.y;
        const sameWithTwo = (a, b, c) => same(a, b) || same(a, c);

        return function (points) {

            let assembled = [];

            for (let i = 0; i < points.length - 1; i ++) {

                if (sameWithTwo(points[i][0], points[i + 1][0], points[i + 1][1])) {
                    assembled.push(points[i][1]);
                } else {
                    assembled.push(points[i][0]);
                }
            }

            assembled.push(points[points.length - 1][0]);

            return assembled;
        }
    })();

    function reset (graphics) {
        graphics.clear(0, 0);

        tilesProcessed.clear();
        shapes = [];
    }

    function generateMeshes (metaballs) {
        for (let y = 0; y < height; y += tileSize) {
            for (let x = 0; x < width; x += tileSize) {
                getShapeMesh(metaballs, x, y);
            }
        }
    }

    function displayMetaballs (graphics) {
        graphics.fill(200, 20, 20, 200);
        graphics.stroke(0);
        graphics.strokeWeight(2);
        graphics.noStroke();

        for (const i of shapes) {
            if (i.length < 1) continue;

            let shape = assembleShape(i);
            graphics.beginShape();

            for (const j of shape) {
                graphics.vertex(j.x, j.y);
            }

            graphics.endShape();
        }
    }

    return function (metaballs, graphics) {
        
        reset(graphics);
        generateMeshes(metaballs);
        displayMetaballs(graphics);

        return graphics;
    }
})();

const {player, metaballs} = (() => {
    class Metaball {
        constructor (config) {
            this.position = config.position ?? new Vector(config.x ?? 0, config.y ?? 0);
            this.velocity = new Vector();

            this.radius = config.radius;
        }

        get x () {
            return this.position.x;
        }

        get y () {
            return this.position.y;
        }

        set x (x) {
            this.position.x = x;
        }

        set y (y) {
            this.position.y = y;
        }

        get dead () {
            return false;
        }

        run () {
            this.update();
            this.display();

            return this.dead;
        }

        update () {

        }

        display () {

        }
    }

    const metaballs = {
        metaballs: [],

        run () {
            for (var i = this.metaballs.length - 1; i >= 0; i--) {
                if (this.metaballs[i].run) this.metaballs.splice(i, 1);
            }
        },

        add (config) {

            const metaball = new Metaball(config);

            this.metaballs.push(metaball);
            return metaball;
        },
    };

    metaballs.add({x: 300, y: 300, radius: 70})
    const player = metaballs.add({x: 500, y: 300, radius: 40})

    return {player, metaballs};
})();

const scenes = (() => {

    const startScene = "play";

    // returns an object with a function for each scene and a function that runs the current scene. This function will also transition to a new scene at the end of the frame if necesary.
    // the reason that the scene functions are the way they are(an iife returning a function) is so that each scene can have a local scope to store data that is only relevant to the scene.

    return {
        current: "loading",

        run () {
            this[this.current](); // run the current scene

            click = false;

            if (scenes.nextTransition) { // transition
                scenes.nextTransition[1] = scenes.nextTransition[1](); // get the image of the canvas at the time of the start of the transition
                scenes.transition(...scenes.nextTransition)
            };
        },

        nextTransition: false,
        transitionTo: false, // so buttons can display during the transition
    
        transition: (() => {

            const anim1 = x => 4 *(x - 0.5) ** 3 + 0.5;
    
            let fromImg;
            let to = "";
            let amt = 0;
            let speed = 1;
            let data = false;
            let sentData = false;
            let transitionType = "slide";
            let transitionData = false;
    
            return function (_to, img, _speed, _transitionType = "slide", _data, _transitionData) {
    
                amt += (delataTime)/1000/speed;
                
                if (_to) {

                    // so we dont try to transition twice
                    scenes.nextTransition = false;
                    
                    // reset data for the transition
                    to = _to;
                    scenes.transitionTo = to;
                    transitionType = _transitionType;
                    fromImg = img;
                    scenes.current = "transition";
                    amt = 0;
                    data = _data || false;
                    transitionData = _transitionData || false;
                    sentData = false;

                    if (_speed && _speed > 0) speed = _speed;
                }
    
                if (amt < 0.5) {
                    // display image from last scene
                    image(fromImg, 0, 0, 600, 600);
                } else if (amt < 1){
                    // run the next scene
                    if (sentData) {
                        scenes[to]();
                    } else {
                        scenes[to](data);
                        sentData = true;
                    }
                    
                } else {
                    // switch to the next scene
                    scenes.current = to;
                    scenes.transitionTo = false;
                }
        
                if (transitionType === "shrink") {

                    if (amt < 0.5) amt = 0.5; // only second half of transition
                    const a = (amt - 0.5) * 2;

                    noStroke();
                    fill(240);
                    rect(a * 27, a * 267, lerp(606, 306, a), lerp(606, 306, a));
                    image(fromImg, a * 30, a * 270, lerp(600, 300, a), lerp(600, 300, a))

                } else if (transitionType === "zoom") {

                    const [midX, midY, scale] = [
                        transitionData.x,
                        transitionData.y,
                        transitionData.scale,
                    ];

                    const [tX, tY, tWidth, tHeight] = [
                        -(width / scale) + (300 - midX),
                        -(height / scale) + (300 - midY),
                        width * scale,
                        height * scale,
                    ]

                    image(fromImg, lerp(0, tX, amt), lerp(0, tY, amt), lerp(600, tWidth, amt), lerp(600, tWidth, amt));

                } else {

                    // the gray square that sweeps over the screen
                    fill(220);
                    noStroke();
                    rect(-600 + 1200 * anim1(amt), 0, 600, 600);

                }
                
            }
        })(),
    
        loading: (() => {
    
            let curInd = 0;
            let keys = Object.keys(images);
    
            return function () {

                background(240);
    
                // replace the functions in the image objects with what they return;
                if (images[keys[curInd]]) images[keys[curInd]] = images[keys[curInd]]();
                
                // generate text with . for progress
                let txt = (() => {
    
                    if (curInd >= keys.length - 1) return "LOADED!";
    
                    let res = ["LOADING"];
                    for (let j = 0; j <= curInd / 2; j ++) {
                        res[res.length - 1] += "."
                        if (textWidth(res[res.length - 1]) > 550) {
                            res[res.length - 1] += "\n";
                            res.push("");
                        }
                    }

                    const innitial = "";
                    const fullRes = res.reduce(
                       (accumulator, currentValue) => accumulator + currentValue,
                        innitial,
                    );

                    return fullRes;
                })();
                
                // Display the loading progress
                textSize(100);
                textFont('Anton');
                fill(220);
                textAlign(CENTER, BASELINE);
    
                text(txt, 300, 270);
    
                curInd ++;

                if (curInd >= keys.length) {
                    scenes.nextTransition = [startScene, get, 0.3, "slide", {}];
                }
            }
        })(),

        play: (() => {

            const metaballsGraphics = (() => {
                
                const g = createGraphics(600, 600);
                g.noStroke();

                return g;
            })()

            function displayBackground () {
                background(200);
            }

            function displayMetaballs () {
                image(renderMetaBalls(metaballs.metaballs, metaballsGraphics), 0, 0);
            }

            return function () {

                player.x = mouseX;
                player.y = mouseY;
                
                displayBackground();
                displayMetaballs();
            }
        })(),
    };
})();

const drawFunction = (() => {

    // for delta time calculations
    let then = performance.now();

    // not using function x() {} notation because iife. iife is simply for organization here
    setup = function() {
    
        // this clears all animation frames preventing them from stacking up if the webpage is reloaded
        // sourced from stack overflow somewhere
        let id = window.requestAnimationFrame(function(){});
        while (id--) {
            window.cancelAnimationFrame(id);
        }
        
        createCanvas(WIDTH, HEIGHT);
        frameRate(60);
    };
    
    draw = function() {

        let now = performance.now();
        delataTime = now - then;
        then = now;

        scenes.run();
    };
})();

const userInput = (() => {
    // not using function x() {} notation because iife. iife is simply for organization here

    mousePressed = function() {
        click = true;
    }

    keyPressed = function() {
        keys[key] = keys[key.toString().toLowerCase()] = true;
    }
    
    keyReleased = function() {
        keys[key] = keys[key.toString().toLowerCase()] = false;
    }
})();

})();

    </script>
